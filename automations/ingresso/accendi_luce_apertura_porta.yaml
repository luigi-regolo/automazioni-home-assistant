blueprint:
  name: "Accendi luce ingresso all'apertura della porta"
  description: >-
    Accende la luce scelta all'apertura di una porta, esclusivamente
    dopo il tramonto o prima dell'alba. Non spegne la luce.
    Seleziona un sensore porta e una luce della tua installazione.
  domain: automation
  input:
    sensore_porta:
      name: Sensore porta
      description: >-
        Seleziona il sensore della porta (spento quando chiusa,
        acceso quando aperta).
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class:
                - door
                - opening
    luce_ingresso:
      name: Luce da accendere
      description: Seleziona la luce da accendere.
      selector:
        target:
          entity:
            - domain: light

mode: single

triggers:
  - trigger: state
    entity_id: !input sensore_porta
    from: "off"
    to: "on"

conditions:
  - condition: or
    conditions:
      - condition: sun
        after: sunset
      - condition: sun
        before: sunrise

actions:
  - action: light.turn_on
    target: !input luce_ingresso
