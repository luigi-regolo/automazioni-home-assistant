blueprint:
  name: "Accensione programmata presa macchina del caffè"
  description: >-
    Pensata per alimentare una macchina del caffè collegata a una presa
    smart dal lunedì al venerdì, all'orario configurato (predefinito 07:00),
    soltanto se la persona o il dispositivo scelto risulta a casa.
    Accende la presa, ma non garantisce che la macchina avvii la preparazione.
    Non spegne automaticamente la presa.
    Se la posizione non è aggiornata, il risultato potrebbe non
    riflettere la presenza reale. Verifica che l'apparecchio collegato
    possa essere alimentato in sicurezza senza sorveglianza.
  domain: automation
  author: luigi-regolo
  input:
    orario_accensione:
      name: Orario di accensione
      description: Orario di accensione della presa, dal lunedì al venerdì.
      default: "07:00:00"
      selector:
        time: {}
    entita_presenza:
      name: Presenza in casa
      description: >-
        Seleziona una persona o un dispositivo di tracciamento posizione.
        L'automazione si esegue solo se lo stato è home.
      selector:
        entity:
          filter:
            - domain: person
            - domain: device_tracker
    presa_smart:
      name: Presa macchina del caffè
      description: Seleziona la presa smart collegata alla macchina del caffè.
      selector:
        entity:
          filter:
            - domain: switch

triggers:
  - trigger: time
    at: !input orario_accensione
    weekday:
      - mon
      - tue
      - wed
      - thu
      - fri

conditions:
  - condition: state
    entity_id: !input entita_presenza
    state: "home"

actions:
  - action: switch.turn_on
    target:
      entity_id: !input presa_smart

mode: single
