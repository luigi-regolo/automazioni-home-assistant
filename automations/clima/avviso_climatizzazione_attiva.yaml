blueprint:
  name: "Avviso valvole riscaldamento attive"
  description: >-
    Invia una notifica quando una delle valvole termostatiche o dei
    termostati selezionati indica riscaldamento attivo per almeno
    5 secondi (attributo hvac_action uguale a heating).
    Richiede entità climate che espongano questo attributo.
    Non rileva raffreddamento o deumidificazione.
  domain: automation
  author: luigi-regolo
  input:
    climatizzatori:
      name: Valvole o termostati del riscaldamento
      description: >-
        Seleziona una o più entità climate delle valvole termostatiche
        o dei termostati che espongono hvac_action.
      selector:
        entity:
          multiple: true
          filter:
            - domain: climate
    smartphone:
      name: Smartphone da notificare
      description: Seleziona lo smartphone con l'app Home Assistant.
      selector:
        device:
          filter:
            - integration: mobile_app
    titolo_notifica:
      name: Titolo della notifica
      default: "Riscaldamento acceso"
      selector:
        text: {}
    messaggio_notifica:
      name: Messaggio della notifica
      default: "Le valvole si sono attivate e il riscaldamento è partito"
      selector:
        text: {}

triggers:
  - trigger: state
    entity_id: !input climatizzatori
    attribute: hvac_action
    to: "heating"
    for:
      seconds: 5

conditions: []

actions:
  - domain: mobile_app
    type: notify
    device_id: !input smartphone
    title: !input titolo_notifica
    message: !input messaggio_notifica

mode: queued
max: 10
