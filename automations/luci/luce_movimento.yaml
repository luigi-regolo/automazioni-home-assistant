blueprint:
  name: Luce automatica con movimento
  description: >
    Accende le luci quando viene rilevato un movimento e le spegne
    dopo un periodo configurabile senza movimento.
    Se il movimento riprende durante l'attesa, il timer riparte.
    Richiede un sensore di movimento e una o piu luci.
  domain: automation
  author: Automazioni Pronte per Home Assistant
  input:
    motion_sensor:
      name: Sensore di movimento
      description: Seleziona il sensore che deve accendere le luci.
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class: motion
    target_light:
      name: Luci da accendere
      description: Seleziona le luci controllate dall'automazione.
      selector:
        target:
          entity:
            - domain: light
    no_motion_wait:
      name: Tempo prima dello spegnimento
      description: Secondi da attendere dopo la fine del movimento.
      default: 120
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds

mode: restart
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input motion_sensor
    from: "off"
    to: "on"

actions:
  - action: light.turn_on
    target: !input target_light
  - wait_for_trigger:
      - trigger: state
        entity_id: !input motion_sensor
        from: "on"
        to: "off"
  - delay: !input no_motion_wait
  - action: light.turn_off
    target: !input target_light
